{% extends "base.html" %} {% block title %}Acceso Restringido · Elecciones
2025{% endblock %} {% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4">
  <div
    class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden"
  >
    <div class="bg-slate-900 px-8 py-6 text-center">
      <div
        class="h-12 w-12 mx-auto mb-3 rounded-xl bg-gradient-to-br from-blue-500 to-blue-700 text-white grid place-items-center font-bold text-2xl shadow-lg"
      >
        E
      </div>
      <h2 class="text-white font-bold text-xl">Sistema de Simulación</h2>
      <p class="text-slate-400 text-sm">Acceso Administrativo</p>
    </div>

    <div class="p-8">
      <form action="{{ url_for('login') }}" method="post" class="space-y-6">
        <div>
          <label
            for="password"
            class="block text-sm font-medium text-slate-700 mb-2"
          >
            Contraseña de seguridad
          </label>
          <input
            type="password"
            name="password"
            id="password"
            required
            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
            placeholder="••••••••"
          />
        </div>

        {% if error %}
        <div
          class="p-3 rounded-lg bg-red-50 border border-red-200 text-red-600 text-sm text-center font-medium animate-pulse"
        >
          ⚠️ {{ error }}
        </div>
        {% endif %}

        <button
          type="submit"
          class="w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-blue-800 text-white font-bold rounded-xl hover:shadow-lg hover:translate-y-[-1px] transition-all"
        >
          Ingresar al Sistema
        </button>
      </form>
    </div>

    <div class="bg-slate-50 px-8 py-4 text-center border-t border-slate-100">
      <p class="text-xs text-slate-400">
        Solo personal autorizado del Taller de Simulación
      </p>
    </div>
  </div>
</div>

<style>
  nav {
    display: none !important;
  }
  footer {
    position: fixed;
    bottom: 0;
    width: 100%;
  }
</style>
{% endblock %}
