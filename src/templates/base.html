<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/caja-de-votacion.png') }}">
  <title>{% block title %}Elecciones 2025 · Simulación{% endblock %}</title>

  <!-- Tailwind CDN (modo simple) -->
  <script src="https://cdn.tailwindcss.com"></script>

  {% block head_extra %}{% endblock %}
</head>

<body class="bg-white text-slate-900">
  <!-- NAVBAR -->
  <nav class="border-b bg-white/80 backdrop-blur">
    <div class="mx-auto max-w-7xl px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-9 w-9 rounded-xl bg-slate-900 text-white grid place-items-center font-bold">E</div>
        <div class="leading-tight">
          <div class="font-semibold">Elecciones 2025</div>
          <div class="text-xs text-slate-500">Motor ABM + Monte Carlo</div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <a href="{{ url_for('dashboard') }}"
           class="px-3 py-2 rounded-xl text-sm font-semibold border hover:bg-slate-50">
          Dashboard
        </a>
        <a href="{{ url_for('encuesta') }}"
           class="px-3 py-2 rounded-xl text-sm font-semibold bg-slate-900 text-white hover:bg-slate-800">
          Ver encuesta
        </a>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}
</body>
</html>
